<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XRDC — animated splash</title><style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#04060E;display:flex;align-items:center;justify-content:center;
  font-family:Poppins,system-ui,sans-serif}
.stage{width:min(92vmin,560px);aspect-ratio:1;position:relative;cursor:pointer}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#3F5A86;
  font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:300;user-select:none}

/* twinkle of reciprocal-lattice points */
.tw{opacity:var(--o)}
.go .tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:calc(var(--o)*0.5)}50%{opacity:var(--o)}}

/* Debye-Scherrer rings: expand from the (000) origin and fade */
.dsr{opacity:0;stroke-width:2.4}
.go .dsr{animation:dsr 5.2s linear infinite}
@keyframes dsr{
  0%{r:6px;opacity:0;stroke-width:3.2}
  6%{opacity:.85}
  60%{opacity:.30}
  100%{r:250px;opacity:0;stroke-width:.4}
}

/* pulsing (000) origin */
.go .oglow{animation:pulse 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.9);opacity:1}}

/* launch: crystal scales/fades in once, with a bright initial ring burst */
.crystal{transform-box:fill-box;transform-origin:center}
.go .crystal{animation:launch 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes launch{0%{opacity:0;transform:scale(.8)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.go .lattice{animation:fadein 1.4s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.wm{position:fixed;bottom:34px;left:0;right:0;text-align:center;color:#A9D8FF;font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:30px;letter-spacing:11px;text-indent:11px;user-select:none;opacity:0}.wm span{display:block;margin-top:8px;font-size:11px;font-weight:300;letter-spacing:5px;text-indent:5px;text-transform:uppercase;color:#3F5A86}.go .wm{animation:fadein 1.6s ease both}
</style></head>
