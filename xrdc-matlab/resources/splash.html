<!-- @dsCard group="Brand" viewport="400x400" name="App splash — animated" subtitle="400×400 launch screen — rotating unit cell + diffraction" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XRDC — Animated splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Mono:wght@400;700&display=swap" />
<style>
  :root { color-scheme: dark;
    --font-sans: 'Segoe UI', system-ui, sans-serif;
    --ease-standard: cubic-bezier(.2,.8,.2,1); }
  html, body { margin: 0; height: 100%; }
  body { background: #060912; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .splash {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(115% 100% at 50% 42%, #14233f 0%, #0a1124 52%, #060912 100%);
    font-family: var(--font-sans); cursor: pointer;
  }
  .splash::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.06); pointer-events: none; }

  svg { position: absolute; inset: 0; }

  /* twinkle of reciprocal-lattice spots */
  .go .tw { animation: tw 3.4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: calc(var(--o) * .45); } 50% { opacity: var(--o); } }
  /* launch: cell + content rise in once */
  #cell, .reveal { will-change: transform, opacity; }
  .go #cell { animation: launch 1s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes launch { 0% { opacity: 0; transform: scale(.78); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  .go .reveal { animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* foreground content */
  .fg { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 36px 28px; text-align: center; }
  .name { font-family: 'Chakra Petch', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 4px;
    color: #fff; line-height: 1; text-shadow: 0 0 22px rgba(96,160,255,.45); }
  .bar { margin-top: 16px; height: 2.5px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; position: relative; }
  .bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, #5aa0ff, transparent); animation: scan 1.6s var(--ease-standard) infinite; }
  @keyframes scan { 0% { left: -44%; } 100% { left: 102%; } }
  .status { margin-top: 11px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .12em; color: #6f8fc4; }

  .hint { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-family: 'Space Mono', monospace;
    font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: #3f5a86; opacity: .8; user-select: none; }

  @media (prefers-reduced-motion: reduce) {
    .tw, .bar::before { animation: none; }
    .bar::before { left: 0; width: 66%; }
  }
</style>
</head>
<body>
  <div class="splash" id="stage">
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="spot" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#dcf1ff" stop-opacity="1"/><stop offset="100%" stop-color="#dcf1ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orig" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="34%" stop-color="#ffe7b8" stop-opacity=".95"/>
          <stop offset="70%" stop-color="#ffcc33" stop-opacity=".45"/><stop offset="100%" stop-color="#ffcc33" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="atomB" cx="38%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#eaf4ff"/><stop offset="55%" stop-color="#8fbcff"/><stop offset="100%" stop-color="#2e6fd6"/>
        </radialGradient>
        <radialGradient id="atomA" cx="38%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#fff4d6"/><stop offset="50%" stop-color="#ffcc33"/><stop offset="100%" stop-color="#e0900f"/>
        </radialGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>

      <g id="spots"></g>

      <g id="cell"></g>
    </svg>

    <div class="fg reveal">
      <div class="name">XRDC</div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const CX = 200, CY = 178, SCALE = 50, FOCAL = 4.6;

    // ---- reciprocal-lattice spot field (diffraction pattern, intensity falls off) ----
    (function spots(){
      const g = document.getElementById('spots');
      const b1 = [26.8, 15.5], b2 = [-26.8, 15.5];   // oblique reciprocal basis
      for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) {
        const x = CX + i*b1[0] + j*b2[0];
        const y = CY + i*b1[1] + j*b2[1] - 8;
        if (x < -6 || x > 406 || y < -6 || y > 360) continue;
        const r2 = i*i + j*j;
        const inten = Math.max(0, 0.5 - r2*0.022);      // brighter near centre
        if (inten < 0.03) continue;
        const halo = document.createElementNS(NS, 'circle');
        halo.setAttribute('cx', x.toFixed(1)); halo.setAttribute('cy', y.toFixed(1));
        halo.setAttribute('r', (1.6 + inten*4).toFixed(1)); halo.setAttribute('fill', 'url(#spot)');
        halo.setAttribute('opacity', (inten*0.5).toFixed(3));
        g.appendChild(halo);
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('class', 'tw'); dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', y.toFixed(1));
        dot.setAttribute('r', (0.8 + inten*1.4).toFixed(1)); dot.setAttribute('fill', '#dcf1ff');
        dot.style.setProperty('--o', (0.25 + inten*1.2).toFixed(2));
        dot.style.animationDelay = (-(r2*0.18) % 3.4).toFixed(2) + 's';
        g.appendChild(dot);
      }
    })();

    // ---- rotating cubic unit cell (corner cations + body-centre B-site + edges) ----
    const V = [];
    for (const z of [-1,1]) for (const y of [-1,1]) for (const x of [-1,1]) V.push([x,y,z]);
    const E = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]];
    const cell = document.getElementById('cell');
    const edgeEls = E.map(() => { const l = document.createElementNS(NS,'line'); l.setAttribute('stroke-linecap','round'); cell.appendChild(l); return l; });
    // body-centre atom (amber) drawn first so it sits behind front corner atoms when far
    const bAtom = document.createElementNS(NS,'circle'); bAtom.setAttribute('fill','url(#atomA)');
    const cornerEls = V.map(() => { const c = document.createElementNS(NS,'circle'); c.setAttribute('fill','url(#atomB)'); return c; });
    cornerEls.forEach(c => cell.appendChild(c));
    cell.insertBefore(bAtom, cornerEls[0]); // will re-sort by depth each frame anyway

    function project(p, ay, ax) {
      const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
      let [x,y,z] = p;
      let x1 = x*cy + z*sy, z1 = -x*sy + z*cy;       // rotate Y
      let y1 = y*cx - z1*sx, z2 = y*sx + z1*cx;      // tilt X
      const f = FOCAL / (FOCAL - z2);
      return { x: CX + x1*SCALE*f, y: CY - y1*SCALE*f, z: z2, f };
    }

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      const ay = (ts - t0) * 0.00042;                 // slow spin
      const ax = -0.46;                               // fixed tilt
      const P = V.map(v => project(v, ay, ax));
      // edges
      E.forEach((e, i) => {
        const a = P[e[0]], b = P[e[1]];
        const l = edgeEls[i];
        l.setAttribute('x1', a.x.toFixed(1)); l.setAttribute('y1', a.y.toFixed(1));
        l.setAttribute('x2', b.x.toFixed(1)); l.setAttribute('y2', b.y.toFixed(1));
        const depth = (a.z + b.z) / 2;                 // -1.4..1.4
        const o = 0.45 + 0.5 * (depth + 1.4) / 2.8;
        l.setAttribute('stroke', '#3f7fe0');
        l.setAttribute('stroke-width', (1.1 + 0.6*(depth+1.4)/2.8).toFixed(2));
        l.setAttribute('opacity', o.toFixed(2));
      });
      // corner atoms
      P.forEach((p, i) => {
        const c = cornerEls[i];
        c.setAttribute('cx', p.x.toFixed(1)); c.setAttribute('cy', p.y.toFixed(1));
        c.setAttribute('r', (3.4 * p.f).toFixed(2));
        c.setAttribute('opacity', (0.7 + 0.3*(p.z+1.4)/2.8).toFixed(2));
      });
      // body centre (amber B-site)
      const bc = project([0,0,0], ay, ax);
      bAtom.setAttribute('cx', bc.x.toFixed(1)); bAtom.setAttribute('cy', bc.y.toFixed(1)); bAtom.setAttribute('r', (5.4*bc.f).toFixed(2));
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---- launch / replay ----
    const stage = document.getElementById('stage');
    function play(){ stage.classList.remove('go'); void stage.offsetWidth; stage.classList.add('go'); }
    stage.addEventListener('click', play);
    play();
  </script>
</body>
</html>
